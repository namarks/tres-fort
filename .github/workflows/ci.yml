name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly full UI coverage on main (Monday, early morning Pacific time).
    - cron: '17 11 * * 1'
  workflow_dispatch:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plans:
    name: plan graph
    runs-on: ubuntu-latest
    outputs:
      ios-suite: ${{ steps.ios-scope.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge parents and the entire push range are needed for scope.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run plans:check
      - name: Select iOS coverage
        id: ios-scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          suite="$(python3 scripts/ci-ios-scope.py --event "$EVENT" --before "$BEFORE")"
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "iOS coverage: $suite"

  ios-tests:
    name: ${{ matrix.shard == 'station' && 'iPad Station' || matrix.shard == 'app-store-iphone' && 'iPhone App Store' || matrix.shard == 'app-store-ipad' && 'iPad App Store' || format('iOS {0} ({1}/{2})', needs.plans.outputs.ios-suite, matrix.shard, needs.plans.outputs.ios-suite == 'full' && 6 || 2) }}
    needs: plans
    # Standard public-repository capacity only; never opt into a paid runner.
    if: github.event.repository.private == false && needs.plans.outputs.ios-suite != 'skip'
    runs-on: macos-15
    # Smoke gates PRs within 30 minutes. Full runs get headroom for slow
    # hosted runners rather than room for more tests; a hang still stops.
    timeout-minutes: ${{ needs.plans.outputs.ios-suite == 'full' && 40 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plans.outputs.ios-suite == 'full' && '[1, 2, 3, 4, 5, 6]' || '[1, 2]') }}
        include:
          - shard: station
          - shard: app-store-iphone
          - shard: app-store-ipad
    env:
      IOS_UI_SUITE: ${{ needs.plans.outputs.ios-suite }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IOS_KEEP_RESULTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          generator_dir="$(mktemp -d "$RUNNER_TEMP/xcodegen.XXXXXX")"
          trap 'rm -rf "$generator_dir"' EXIT
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.3/xcodegen.zip \
            -o "$generator_dir/xcodegen.zip"
          echo "0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878  $generator_dir/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$generator_dir/xcodegen.zip" -d "$generator_dir"
          mkdir -p "$RUNNER_TEMP/tres-fort-tools"
          cp -R "$generator_dir/xcodegen" "$RUNNER_TEMP/tres-fort-tools/"
          echo "$RUNNER_TEMP/tres-fort-tools/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Verify App Store packaging without downloads
        if: matrix.shard == 'app-store-iphone'
        run: python3 test/app-store-packaging.test.py
      - name: Unsigned simulator build and tests
        if: matrix.shard != 'station' && matrix.shard != 'app-store-iphone' && matrix.shard != 'app-store-ipad'
        run: npm run ios:verify -- --runtime com.apple.CoreSimulator.SimRuntime.iOS-26-2 --device com.apple.CoreSimulator.SimDeviceType.iPhone-17 --ui-suite "$IOS_UI_SUITE" --ci-shard ${{ matrix.shard }}
      - name: iPhone App Store build and tests
        if: matrix.shard == 'app-store-iphone'
        env:
          APP_STORE_BUILD: '1'
        run: npm run ios:verify -- --runtime com.apple.CoreSimulator.SimRuntime.iOS-26-2 --device com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro --only-testing TresFortUITests/AppStoreScreenshotTests --only-testing TresFortTests/StationMediaPipeDetectorTests --only-testing TresFortTests/PublicStationTests
      - name: iPad App Store build and tests
        if: matrix.shard == 'app-store-ipad'
        env:
          APP_STORE_BUILD: '1'
        run: npm run ios:verify -- --runtime com.apple.CoreSimulator.SimRuntime.iOS-26-2 --device com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4-8GB --only-testing TresFortTests --only-testing TresFortUITests/AppStoreScreenshotTests --only-testing TresFortUITests/PublicStationJourneyTests --only-testing TresFortUITests/IpadWorkoutDisplayJourneyTests --only-testing TresFortUITests/MemberActivationJourneyTests/testFreshDeviceSignInRestoresExistingTrainingAndStation
      - name: iPad Station build and tests
        if: matrix.shard == 'station'
        run: npm run ios:verify -- --runtime com.apple.CoreSimulator.SimRuntime.iOS-26-2 --device com.apple.CoreSimulator.SimDeviceType.iPad-A16 --only-testing TresFortTests/AuthOnboardingAccountTests --only-testing TresFortTests/StationLiveTests --only-testing TresFortTests/StationPrivacyTests --only-testing TresFortTests/StationCounterTests --only-testing TresFortTests/StationMovementCounterTests --only-testing TresFortTests/StationCurlRecordingTests --only-testing TresFortTests/StationRecordingTests --only-testing TresFortTests/StationReplayTests --only-testing TresFortTests/StationMediaPipeDetectorTests --only-testing TresFortTests/StationDiagnosticsTests --only-testing TresFortTests/StationComparisonTests --only-testing TresFortTests/StationCameraConfigurationTests --only-testing TresFortTests/StationPoseFeedbackTests --only-testing TresFortUITests/StationJourneyTests --only-testing TresFortUITests/IpadWorkoutDisplayJourneyTests --only-testing TresFortUITests/PlanlessAccountJourneyTests --only-testing TresFortUITests/MemberActivationJourneyTests/testFreshDeviceSignInRestoresExistingTrainingAndStation --only-testing TresFortUITests/MemberActivationJourneyTests/testFreshDeviceStateFailureRetriesWithoutOfferingNewAccountSetup --only-testing TresFortUITests/MemberActivationJourneyTests/testFreshDeviceConfirmedEmptyAccountStillOffersSetup
      - name: Retain synthetic screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.plans.outputs.ios-suite }}-${{ matrix.shard }}
          path: .artifacts/ios
          include-hidden-files: true
          retention-days: 7
      - name: Clean verification tools
        if: always()
        run: rm -rf "$RUNNER_TEMP/tres-fort-tools"

  ios:
    name: iOS build + tests
    needs: [plans, ios-tests]
    if: always() && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Require every iOS shard
        env:
          RESULT: ${{ needs.ios-tests.result }}
          SCOPE_RESULT: ${{ needs.plans.result }}
          SUITE: ${{ needs.plans.outputs.ios-suite }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$SUITE" in
            skip) test "$RESULT" = skipped ;;
            smoke|full) test "$RESULT" = success ;;
            *) exit 1 ;;
          esac

  backend-tests:
    name: backend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verification command failure and cleanup checks
        run: |
          python3 test/verify-ios.test.py
          python3 -B -O test/app-store-assets.test.py
          python3 -B test/ci-ios-scope.test.py
          python3 -B test/mediapipe-dependencies.test.py
          ruby test/submit-for-review.test.rb

      - name: Typecheck
        run: npm run typecheck

      # vitest-pool-workers runs the suite in-process against an ephemeral
      # D1 in the workerd runtime — no deployed Worker, no real secrets
      # (vitest.config.ts injects test values). Pure Linux runner.
      - name: Test
        run: npm test -- --shard=${{ matrix.shard }}/3

  backend:
    name: typecheck + tests
    needs: backend-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend shard
        env:
          RESULT: ${{ needs.backend-tests.result }}
        run: test "$RESULT" = success
