# XcodeGen spec. Regenerate the .xcodeproj with: cd ios && xcodegen generate
name: LiftCoach
options:
  bundleIdPrefix: com.nmarkspdx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  LiftCoach:
    type: application
    platform: iOS
    sources:
      - LiftCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nmarkspdx.liftcoach
        INFOPLIST_FILE: LiftCoach/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiftCoach/LiftCoach.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "8BA2RY6RCA"   # Nicholas Marks (Apple Developer Program)
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
      # Automatic signing + the team above provisions the Sign in with
      # Apple capability. To use a different team, change DEVELOPMENT_TEAM
      # and re-run `xcodegen generate`.
